; Cheap Yellow Display (ESP32 + 4.0" ST7796), same board Kori used.
; GY-521 on the I2C socket: SDA GPIO 32, SCL GPIO 25.
; From this folder:
;   pio run -t upload
;   pio device monitor

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

; Same 3 MB app partition Kori used. The default 1.25 MB image is full once BLE is linked.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -D USER_SETUP_LOADED=1
    -D CORE_DEBUG_LEVEL=0
    -I "${PROJECT_DIR}/include"
    -include "${PROJECT_DIR}/include/User_Setup.h"
