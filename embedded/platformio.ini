; ESP32-S3-N16R8 GY-521 (MPU-6050) bring-up.
; Flash and watch the log from this folder:
;   pio run -t upload
;   pio device monitor

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16 MB quad flash + 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio

; Native USB already showing up as /dev/cu.usbmodem*.
; USB_MODE=0 keeps Serial on the hardware USB-Serial/JTAG port
; instead of re-enumerating as a second USB device.
; Board default USB_MODE=1 keeps Serial on the hardware
; USB-Serial/JTAG port. That is the port esptool and the
; Mac already see; TinyUSB was enumerating and then dropping bytes.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.14
    adafruit/Adafruit GFX Library@^1.12.1

upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
monitor_filters = esp32_exception_decoder

; USB-Serial/JTAG accepts usb-reset, so upload does not need the BOOT button.
board_upload.before_reset = usb-reset
board_upload.after_reset = watchdog-reset
